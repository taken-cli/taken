# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  setup:
    desc: Set up the development environment
    cmds:
      - uv sync --dev --group test
      - pre-commit install

  fmt:
    desc: Format code with ruff
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  fmt:check:
    desc: Check formatting and types (ruff + pyrefly)
    aliases:
      - check
      - fmt-check
    cmds:
      - uv run ruff check .
      - uv run pyrefly check
      - uv run ruff format --check --diff .

  test:
    desc: Run unit tests (excludes integration)
    cmds:
      - uv run pytest -m "not integration"

  test:integration:
    desc: Run integration tests against the real CLI binary
    aliases:
      - test:int
      - test:i
    cmds:
      - uv run pytest -m integration -v

  test:all:
    desc: Run all tests including integration
    aliases:
      - test:a
    cmds:
      - uv run pytest -v

  docs:serve:
    desc: Serve docs locally with live reload
    aliases:
      - docs:s
    cmds:
      - uv run --group docs mkdocs serve

  docs:build:
    desc: Build docs to site/
    aliases:
      - docs:b
    cmds:
      - uv run --group docs mkdocs build