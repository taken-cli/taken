name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  check-ci:
    name: Verify CI passed
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI to pass on tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow ci.yml \
            --commit ${{ github.sha }} \
            --json databaseId \
            --jq '.[0].databaseId')
          [ -z "$run_id" ] || [ "$run_id" = "null" ] && { echo "No CI run found for this commit"; exit 1; }
          echo "Waiting for CI run $run_id..."
          gh run watch "$run_id" --exit-status

  build:
    needs: check-ci
    uses: ./.github/workflows/_build.yml

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v5

      - name: Publish
        run: uv publish

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
